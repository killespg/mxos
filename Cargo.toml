[package]
name = "mxos"
version = "0.11.0"
edition = "2024"
description = "MXOS: kernel ARM64 escrito do zero em Rust para a TV box MXQ PRO 4K"

[[bin]]
name = "mxos"
test = false
bench = false

[features]
# Compila para a TV box (Amlogic S905W) em vez do QEMU virt.
mxq = []
# TV box com Rockchip RK3228/RK3229 (Cortex-A7, ARMv7 32 bits):
# --target armv7a-none-eabihf (rodar.py --rk322x)
rk322x = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
